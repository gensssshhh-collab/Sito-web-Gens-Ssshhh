name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"] # Si attiva ad ogni push sul branch principale
    paths:
      - 'www/**'       # Solo se ci sono modifiche nella cartella www

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Write release metadata
        run: |
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          RELEASE_ID=$(date -u +%Y%m%d)
          cat > ./www/release.json <<EOF
          {
            "app": "Gens Ssshhh",
            "version": "1.0.0",
            "releaseDate": "${RELEASE_DATE}",
            "releaseId": "${RELEASE_ID}"
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www' # Prende solo la cartella del tuo frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4