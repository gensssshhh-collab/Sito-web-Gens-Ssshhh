name: Build Android APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installazione Dipendenze
        run: npm install

      - name: Sincronizzazione Capacitor
        run: npx cap sync android

      - name: Definizione data release
        id: release
        run: echo "release_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compilazione APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          RELEASE_DATE=${{ steps.release.outputs.release_date }}
          RELEASE_ID=${RELEASE_DATE//-/}
          ./gradlew assembleDebug -PreleaseDate=$RELEASE_ID
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Gens-Ssshhh-App-${RELEASE_DATE}.apk

      - name: Salvataggio APK
        uses: actions/upload-artifact@v4
        with:
          name: Gens-Ssshhh-App-${{ steps.release.outputs.release_date }}
          path: android/app/build/outputs/apk/debug/Gens-Ssshhh-App-*.apk